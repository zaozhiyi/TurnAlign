[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnalign"
version = "0.1.0"
description = "Model-agnostic streaming ASR orchestration primitives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TurnAlign contributors" }]
dependencies = []

[project.optional-dependencies]
microphone = ["sounddevice>=0.5,<1"]
server = ["websockets>=14,<18"]
transformers = ["accelerate>=1.0,<3", "numpy>=1.26,<3", "transformers>=4.57,<6"]
faster-whisper = ["faster-whisper>=1.1,<2", "numpy>=1.26,<3"]
funasr = ["funasr>=1.2,<2", "numpy>=1.26,<3", "torchaudio>=2.0,<3"]
funasr-pipeline = ["funasr>=1.2,<2", "numpy>=1.26,<3", "torchaudio>=2.0,<3"]

[project.scripts]
turnalign = "turnalign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
