name: cross-platform-core

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.5 bandit==1.8.6 mypy==1.18.2
      - run: ruff check src tests
      - run: bandit -q -r src -ll
      - run: mypy --no-error-summary
      - name: Verify systemd deployment unit
        run: |
          if ! getent passwd turnalign >/dev/null; then
            sudo useradd --system --home /var/lib/turnalign --shell /usr/sbin/nologin turnalign
          fi
          sudo install -d /opt/turnalign/venv/bin /etc/turnalign /var/lib/turnalign
          sudo install -m 0755 /usr/bin/true /opt/turnalign/venv/bin/turnalign
          sudo touch /etc/turnalign/turnalign.env /var/lib/turnalign/warmup.wav
          systemd-analyze verify deploy/systemd/turnalign.service
      - name: Verify Nginx deployment configuration
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx-light
          sudo install -d /etc/letsencrypt/live/asr.example.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=asr.example.com \
            -keyout /etc/letsencrypt/live/asr.example.com/privkey.pem \
            -out /etc/letsencrypt/live/asr.example.com/fullchain.pem
          sudo install -m 0644 deploy/nginx/turnalign.conf.example \
            /etc/nginx/conf.d/turnalign.conf
          sudo nginx -t

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[server]"
      - run: python -m unittest discover -s tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -O -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: turnalign doctor --device cpu

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --upgrade pip build==1.4.4 twine==6.2.0
          cyclonedx-bom==7.3.1
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: python -m build --outdir dist-a
      - run: python -m build --outdir dist-b
      - run: cmp dist-a/*.whl dist-b/*.whl && cmp dist-a/*.tar.gz dist-b/*.tar.gz
      - run: python -m twine check dist-a/*
      - name: Generate reproducible server SBOM
        run: |
          python -m venv sbom-env
          sbom-env/bin/python -m pip install --upgrade pip
          sbom-env/bin/python -m pip install dist-a/*.whl "websockets==17.1"
          cyclonedx-py environment sbom-env/bin/python \
            --pyproject pyproject.toml --mc-type application --sv 1.6 \
            --output-reproducible --of JSON -o dist-a/sbom.cdx.json
          cyclonedx-py environment sbom-env/bin/python \
            --pyproject pyproject.toml --mc-type application --sv 1.6 \
            --output-reproducible --of JSON -o /tmp/turnalign-sbom.cdx.json
          cmp dist-a/sbom.cdx.json /tmp/turnalign-sbom.cdx.json
      - run: cd dist-a && sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
      - run: python -m pip install --force-reinstall dist-a/*.whl "websockets==17.1"
      - run: >-
          python -c "import pathlib, turnalign;
          assert 'site-packages' in str(pathlib.Path(turnalign.__file__))"
      - run: python -m unittest discover -s tests
      - run: turnalign doctor --device cpu
      - run: turnalign quality-gate --help
      - run: turnalign release-gate --help
      - run: turnalign websocket-gate --help
      - run: turnalign production-gate --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turnalign-distributions
          path: dist-a/
          if-no-files-found: error
          retention-days: 14

  server-minimum-dependency:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "." "websockets==14.0"
      - run: >-
          python -m unittest
          tests.test_server.ServerConfigurationTests.test_standalone_server_exits_cleanly_on_sigterm
          tests.test_server.WebSocketTests.test_health_readiness_origin_policy_and_graceful_shutdown

  dependency-audit:
    strategy:
      matrix:
        websockets: ["14.0", "17.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --upgrade pip pip-audit==2.9.0
          build==1.4.4 twine==6.2.0 hatchling==1.27.0
          cyclonedx-bom==7.3.1
      - run: python -m pip install "." "websockets==${{ matrix.websockets }}"
      - run: python -m pip_audit
