name: cross-platform-core

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.5 bandit==1.8.6 mypy==1.18.2
      - run: ruff check src tests
      - run: bandit -q -r src -ll
      - run: mypy --no-error-summary

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[server]"
      - run: python -m unittest discover -s tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -O -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: turnalign doctor --device cpu

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build==1.4.4 twine==6.2.0
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: python -m build --outdir dist-a
      - run: python -m build --outdir dist-b
      - run: cmp dist-a/*.whl dist-b/*.whl && cmp dist-a/*.tar.gz dist-b/*.tar.gz
      - run: python -m twine check dist-a/*
      - run: cd dist-a && sha256sum *.whl *.tar.gz > SHA256SUMS
      - run: python -m pip install --force-reinstall dist-a/*.whl "websockets==17.1"
      - run: >-
          python -c "import pathlib, turnalign;
          assert 'site-packages' in str(pathlib.Path(turnalign.__file__))"
      - run: python -m unittest discover -s tests
      - run: turnalign doctor --device cpu
      - run: turnalign quality-gate --help
      - run: turnalign release-gate --help
      - run: turnalign websocket-gate --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turnalign-distributions
          path: dist-a/
          if-no-files-found: error
          retention-days: 14

  server-minimum-dependency:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "." "websockets==14.0"
      - run: >-
          python -m unittest
          tests.test_server.ServerConfigurationTests.test_standalone_server_exits_cleanly_on_sigterm
          tests.test_server.WebSocketTests.test_health_readiness_origin_policy_and_graceful_shutdown

  dependency-audit:
    strategy:
      matrix:
        websockets: ["14.0", "17.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --upgrade pip pip-audit==2.9.0
          build==1.4.4 twine==6.2.0 hatchling==1.27.0
      - run: python -m pip install "." "websockets==${{ matrix.websockets }}"
      - run: python -m pip_audit
